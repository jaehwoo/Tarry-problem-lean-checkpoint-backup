name: Reproduce Paper I second portfolio (2026-11-13)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'reproducibility/second-portfolio-20261113/**'
      - '.github/workflows/reproduce-second-portfolio.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the exact Lean release
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --max-time 600 \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst \
            --output lean-4.19.0-linux.tar.zst
          printf '%s  %s\n' \
            '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe' \
            'lean-4.19.0-linux.tar.zst' | sha256sum --check
          tar --zstd -xf lean-4.19.0-linux.tar.zst
          printf '%s\n' "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Recompile preserved sources and audit endpoints
        working-directory: reproducibility/second-portfolio-20261113
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_sources.py
          mkdir -p run-results
          bash scripts/prepare_cache_limited.sh 2>&1 | tee run-results/cache-preparation.log
          python3 scripts/reproduce.py --skip-cache --jobs 2 --output run-results/ci
      - name: Preserve pass or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-i-second-portfolio-reproduction
          path: reproducibility/second-portfolio-20261113/run-results/
          if-no-files-found: warn
          retention-days: 30
