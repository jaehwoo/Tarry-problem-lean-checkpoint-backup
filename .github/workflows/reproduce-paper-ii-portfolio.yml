name: Reproduce five Paper II Lean proofs (2026-11-13)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'reproducibility/paper-ii-portfolio-20261113/**'
      - '.github/workflows/reproduce-paper-ii-portfolio.yml'
  pull_request:
    paths:
      - 'reproducibility/paper-ii-portfolio-20261113/**'
      - '.github/workflows/reproduce-paper-ii-portfolio.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Lean 4.19.0
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --max-time 600 \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst \
            --output lean-4.19.0-linux.tar.zst
          printf '%s  %s\n' \
            '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe' \
            'lean-4.19.0-linux.tar.zst' | sha256sum --check
          tar --zstd -xf lean-4.19.0-linux.tar.zst
          printf '%s\n' "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned Mathlib dependencies
        working-directory: reproducibility/paper-ii-portfolio-20261113
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          mkdir -p run-results
          bash prepare-dependencies.sh "$RUNNER_TEMP/mathlib" 2>&1 | tee run-results/dependencies.log
      - name: Recompile all five proofs and replay declaration audits
        working-directory: reproducibility/paper-ii-portfolio-20261113
        shell: bash
        run: |
          set -euo pipefail
          python3 reproduce.py --mathlib "$RUNNER_TEMP/mathlib" --output run-results/ci
      - name: Preserve pass or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-ii-portfolio-reproduction
          path: |
            reproducibility/paper-ii-portfolio-20261113/run-results/dependencies.log
            reproducibility/paper-ii-portfolio-20261113/run-results/ci/*.log
            reproducibility/paper-ii-portfolio-20261113/run-results/ci/*.json
            reproducibility/paper-ii-portfolio-20261113/run-results/ci/evidence/
          if-no-files-found: warn
          retention-days: 30
