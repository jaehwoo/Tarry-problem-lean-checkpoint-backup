name: Verify Paper I 116 progress addendum
on:
  push:
    branches: [main]
    paths: [.github/workflows/paper-i-116-progress-verify.yml]
permissions:
  # One-off token for private draft visibility; verifier only reads remote data.
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read pinned verifier and addendum source metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          root=pathlib.Path('catalog');root.mkdir()
          files=[('source.json','checkpoint-import/updates/2026-10-15-progress-116/source.json',os.environ['GH_COMMIT']),('verify.py','checkpoint-import/updates/2026-10-15-progress-116/verify.py',os.environ['GH_COMMIT']),('base_verifier.py','checkpoint-import/updates/2026-10-15-through-115/VERIFY_REMOTE.py','3ca4402e150e5b62df50bdb7bd19e8898c3a30f7')]
          for name,path,commit in files:
              req=urllib.request.Request('https://api.github.com/repos/jaehwoo/lean-checkpoint-backup/contents/'+path+'?ref='+commit,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'Paper-I-backup-verification'})
              with urllib.request.urlopen(req,timeout=60) as response:data=json.load(response)
              content=base64.b64decode(data['content'])
              assert hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()==data['sha']
              (root/name).write_bytes(content)
          PY
      - name: Download and verify original 116 progress bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 catalog/verify.py
