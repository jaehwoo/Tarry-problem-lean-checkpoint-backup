name: Replay Paper I collar revision (2026-11-21)

# Manual only. Publishing this file must not itself start a verification run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: verification-20261121-collar
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create fresh evidence directory
        run: mkdir -p run-results
      - name: Install checksum-pinned Lean 4.19.0 for Linux
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --max-time 600 \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst \
            --output lean-4.19.0-linux.tar.zst
          printf '%s  %s\n' \
            '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe' \
            'lean-4.19.0-linux.tar.zst' | sha256sum --check
          tar --zstd -xf lean-4.19.0-linux.tar.zst
          printf '%s\n' "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Restore exactly the retained inherited objects
        env:
          REPLAY_ASSET_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/collar-replay-20261121/Paper_I_Collar_Lean_Replay.zip
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 900 \
            "$REPLAY_ASSET_URL" --output "$RUNNER_TEMP/Paper_I_Collar_Lean_Replay.zip"
          python3 scripts/prepare_baseline.py \
            --archive "$RUNNER_TEMP/Paper_I_Collar_Lean_Replay.zip" \
            --receipt run-results/baseline.json 2>&1 | tee run-results/baseline.log
      - name: Fetch the pinned upstream cache and check dependency revisions
        run: |
          set -euo pipefail
          unset LEAN_PATH LEAN_SRC_PATH
          mkdir -p "$RUNNER_TEMP/collar-curl"
          printf 'parallel-max = 4\nrate = "4/s"\n' > "$RUNNER_TEMP/collar-curl/.curlrc"
          CURL_HOME="$RUNNER_TEMP/collar-curl" lake exe cache get 2>&1 | tee run-results/cache.log
          python3 scripts/check_environment.py --receipt run-results/environment.json \
            2>&1 | tee run-results/environment.log
      - name: Recompile revision sources and audit declarations in a fresh directory
        run: |
          set -euo pipefail
          unset LEAN_PATH LEAN_SRC_PATH
          python3 replay.py --out run-results/replay --jobs 2 \
            2>&1 | tee run-results/replay.log
          python3 scripts/check_results.py --out run-results/replay \
            2>&1 | tee run-results/comparison.log
      - name: Preserve pass or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-i-collar-20261121-replay
          path: verification-20261121-collar/run-results/
          if-no-files-found: warn
          retention-days: 90
